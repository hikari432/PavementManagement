

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>工事管理 | 舗装会社 業務管理システム</title>

    <!-- 共通CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <h1>舗装会社 業務管理システム</h1>

        <div class="header-right">
            <a th:href="@{/}" class="header-link">
                ダッシュボード
            </a>
        </div>
    </header>

    <main>

        <!-- ページタイトル -->
        <section class="intro">
            <h2>工事管理</h2>
            <p>工事情報の検索・登録・進捗状況の確認ができます。</p>
        </section>

        <!-- 削除エラーメッセージ -->
        <div th:if="${errorMessage}"
             role="alert"
             style="background-color: #fff1f0;
                    color: #b42318;
                    border: 1px solid #f4b4ae;
                    border-radius: 8px;
                    padding: 16px;
                    margin-bottom: 20px;">

            <strong>削除できません</strong>

            <p th:text="${errorMessage}"
               style="margin: 8px 0 0;">
            </p>

        </div>

        <!-- 削除成功メッセージ -->
        <div th:if="${successMessage}"
             role="status"
             style="background-color: #ecfdf3;
                    color: #067647;
                    border: 1px solid #a6e9c0;
                    border-radius: 8px;
                    padding: 16px;
                    margin-bottom: 20px;">

            <strong>処理が完了しました</strong>

            <p th:text="${successMessage}"
               style="margin: 8px 0 0;">
            </p>

        </div>

        <!-- ページ上部の操作 -->
        <div class="page-actions">

            <a th:href="@{/}" class="btn btn-secondary">
                ← トップページに戻る
            </a>

            <a th:href="@{/projects/new}"
               class="btn btn-primary"
               th:if="${isAdmin}">
                ＋ 工事を登録する
            </a>

        </div>

        <!-- 工事検索 -->
        <section class="content-panel">

            <h2 class="section-title">工事検索</h2>

            <form th:action="@{/projects}"
                  method="get"
                  class="search-form">

                <!-- キーワード検索 -->
                <div class="form-group">

                    <label for="keyword">
                        工事名・発注者
                    </label>

                    <input type="text"
                           id="keyword"
                           name="keyword"
                           th:value="${keyword}"
                           placeholder="キーワードを入力">

                </div>

                <!-- 状態検索 -->
                <div class="form-group">

                    <label for="status">
                        工事の状態
                    </label>

                    <select id="status" name="status">

                        <option value="">すべて</option>

                        <option value="施工前"
                                th:selected="${status == '施工前'}">
                            施工前
                        </option>

                        <option value="施工中"
                                th:selected="${status == '施工中'}">
                            施工中
                        </option>

                        <option value="完了"
                                th:selected="${status == '完了'}">
                            完了
                        </option>

                    </select>

                </div>

                <!-- 検索ボタン -->
                <div class="search-actions">

                    <button type="submit" class="btn btn-primary">
                        検索
                    </button>

                    <a th:href="@{/projects}" class="btn btn-secondary">
                        条件をクリア
                    </a>

                </div>

            </form>

        </section>

        <!-- 工事一覧 -->
        <section class="content-panel">

            <h2 class="section-title">工事一覧</h2>

            <div class="table-wrapper">

                <table class="data-table">

                    <thead>
                        <tr>
                            <th>工事名</th>
                            <th>発注者</th>
                            <th>工事期間</th>
                            <th>状態</th>
                            <th th:if="${isAdmin}">操作</th>
                        </tr>
                    </thead>

                    <tbody>

                        <!-- 工事データを繰り返し表示 -->
                        <tr th:each="project : ${projects}">

                            <!-- 工事名 -->
                            <td th:text="${project.projectName}">
                                工事名
                            </td>

                            <!-- 発注者 -->
                            <td th:text="${project.clientName}">
                                発注者
                            </td>

                            <!-- 工事期間 -->
                            <td>

                                <span th:text="${project.startDate}">
                                    開始日
                                </span>

                                ～

                                <span th:text="${project.endDate}">
                                    終了日
                                </span>

                            </td>

                            <!-- 状態 -->
                            <td>

                                <span class="status-badge"
                                      th:text="${project.status}">
                                    状態
                                </span>

                            </td>

                            <!-- 管理者のみ操作可能 -->
                            <td th:if="${isAdmin}">

                                <div class="table-actions">

                                    <!-- 編集 -->
                                    <a th:href="@{/projects/edit/{id}(id=${project.id})}"
                                       class="btn btn-secondary btn-small">
                                        編集
                                    </a>

                                    <!-- 削除 -->
                                    <form th:action="@{/projects/delete/{id}(id=${project.id})}"
                                          method="post"
                                          onsubmit="return confirm('この工事を削除しますか？');">

                                        <button type="submit"
                                                class="btn btn-danger btn-small">
                                            削除
                                        </button>

                                    </form>

                                </div>

                            </td>

                        </tr>

                        <!-- データがない場合 -->
                        <tr th:if="${#lists.isEmpty(projects)}">

                            <td th:colspan="${isAdmin} ? 5 : 4"
                                class="empty-message">
                                該当する工事はありません。
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        Pavement Management System
    </footer>

</body>
</html>
