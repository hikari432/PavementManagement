
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>工事編集 | 舗装会社 業務管理システム</title>

    <!-- 共通CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <h1>舗装会社 業務管理システム</h1>

        <div class="header-right">
            <a th:href="@{/projects}" class="header-link">
                工事一覧
            </a>
        </div>
    </header>

    <main>

        <!-- ページタイトル -->
        <section class="intro">
            <h2>工事編集</h2>
            <p>登録済みの工事情報を編集できます。</p>
        </section>

        <!-- 編集フォーム -->
        <section class="content-panel form-panel">

            <h2 class="section-title">工事情報の編集</h2>

            <form th:action="@{/projects/edit/{id}(id=${project.id})}"
                  th:object="${project}"
                  method="post">

                <!-- 工事名 -->
                <div class="form-group">

                    <label for="projectName">工事名</label>

                    <input type="text"
                           id="projectName"
                           th:field="*{projectName}"
                           placeholder="工事名を入力">

                    <span class="error"
                          th:if="${#fields.hasErrors('projectName')}"
                          th:errors="*{projectName}">
                    </span>

                </div>

                <!-- 発注者 -->
                <div class="form-group">

                    <label for="clientName">発注者</label>

                    <input type="text"
                           id="clientName"
                           th:field="*{clientName}"
                           placeholder="発注者名を入力">

                    <span class="error"
                          th:if="${#fields.hasErrors('clientName')}"
                          th:errors="*{clientName}">
                    </span>

                </div>

                <!-- 開始日 -->
                <div class="form-group">

                    <label for="startDate">開始日</label>

                    <input type="date"
                           id="startDate"
                           th:field="*{startDate}">

                    <span class="error"
                          th:if="${#fields.hasErrors('startDate')}"
                          th:errors="*{startDate}">
                    </span>

                </div>

                <!-- 終了日 -->
                <div class="form-group">

                    <label for="endDate">終了日</label>

                    <input type="date"
                           id="endDate"
                           th:field="*{endDate}">

                    <span class="error"
                          th:if="${#fields.hasErrors('endDate')}"
                          th:errors="*{endDate}">
                    </span>

                </div>

                <!-- 工事の状態 -->
                <div class="form-group">

                    <label for="status">状態</label>

                    <select id="status" th:field="*{status}">

                        <option value="">選択してください</option>
                        <option value="施工前">施工前</option>
                        <option value="施工中">施工中</option>
                        <option value="完了">完了</option>

                    </select>

                    <span class="error"
                          th:if="${#fields.hasErrors('status')}"
                          th:errors="*{status}">
                    </span>

                </div>

                <!-- 操作ボタン -->
                <div class="form-actions">

                    <button type="submit" class="btn btn-primary">
                        更新する
                    </button>

                    <a th:href="@{/projects}" class="btn btn-secondary">
                        キャンセル
                    </a>

                </div>

            </form>

        </section>

    </main>

    <footer>
        Pavement Management System
    </footer>

</body>
</html>
